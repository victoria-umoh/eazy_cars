name: Deploy to Easyhost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, fileinfo
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies (Production)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Deploy to Easyhost via FTP/SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.EASYHOST_FTP_SERVER }}
          username: ${{ secrets.EASYHOST_FTP_USERNAME }}
          password: ${{ secrets.EASYHOST_FTP_PASSWORD }}
          server-dir: ${{ secrets.EASYHOST_SERVER_DIR || '/' }}
          protocol: ${{ secrets.EASYHOST_FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.EASYHOST_FTP_PORT || 21 }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.phpunit*
            .env
            .env.example
            .env.*
            storage/logs/*.log
            database/*.sqlite
